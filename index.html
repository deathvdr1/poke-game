    <!-- PASTE THE NEW STYLE BLOCK HERE -->
    <style>
        #scary-btn {
            position: relative; /* Required for the animation */
            overflow: hidden; /* Hides the drip until it's ready */
        }

        /* This creates the "drip" element */
        #scary-btn::after {
            content: '';
            position: absolute;
            background: linear-gradient(to bottom, transparent 0%, #b90000 50%, #8c0000 100%);
            width: 10px; /* How wide the drip is */
            height: 40px; /* How long the drip is */
            border-radius: 0 0 50% 50%; /* Rounded bottom */
            box-shadow: 0 0 5px #ff0000, 0 0 10px #8c0000;
            
            /* Start position (hidden above the button) */
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            
            /* Run the animation */
            animation: blood-drip 3s ease-out infinite;
            animation-delay: 1.5s; /* Wait 1.5s before the first drip */
        }

        /* The animation itself */
        @keyframes blood-drip {
            0% {
                top: -40px; /* Start above */
                opacity: 0;
            }
            20% {
                opacity: 1; /* Appear */
            }
            90% {
                top: 5px; /* Drip down just onto the button */
                opacity: 1;
            }
            100% {
                top: 15px; /* Drip a little further */
                opacity: 0; /* Fade out */
            }
        }
    </style>
    <!-- END OF NEW STYLE BLOCK -->
    
</head>
