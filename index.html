<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>(ré)Pokémon Battle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- UPDATED: Added Japanese font -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display.swap" rel="stylesheet">
    <style>
        /* UPDATED: Added :lang() pseudo-classes to switch fonts */
        body:lang(en) {
            font-family: 'Press Start 2P', sans-serif;
        }
        body:lang(ja) {
            /* Use DotGothic16 for Japanese, as Press Start 2P lacks glyphs */
            font-family: 'DotGothic16', sans-serif;
        }

        body {
            background-color: #0c0a18; /* UPDATED: Dark space background */
            /* UPDATED: Removed noise background for new starfield */
            padding-bottom: 80px; /* Added space for the fixed button */
            image-rendering: pixelated; /* Makes pixel fonts sharp */
            text-transform: uppercase; /* Classic game feel */
            font-size: 16px; /* Set a base font size for DotGothic16 */
            overflow: hidden; /* NEW: Prevent stars/rocket from causing scrollbars */
        }
        
        /* Ensure pixel font is used in buttons too */
        body:lang(en) .retro-btn, body:lang(en) .battle-log, body:lang(en) .victory-text-base, body:lang(en) .help-screen {
            font-family: 'Press Start 2P', sans-serif;
        }
        body:lang(ja) .retro-btn, body:lang(ja) .battle-log, body:lang(ja) .victory-text-base, body:lang(ja) .help-screen {
            font-family: 'DotGothic16', sans-serif;
            /* Japanese font might need size adjustment */
            font-size: 1.1rem; 
            line-height: 1.5;
        }
        /* Override for smaller elements */
        body:lang(ja) h2, body:lang(ja) span, body:lang(ja) p {
             font-size: 1.0rem;
        }
        body:lang(ja) .retro-btn.attack-btn {
            font-size: 0.75rem; /* NEW: Made even smaller for mobile */
            line-height: 1.2;
        }
        @media (min-width: 768px) {
            body:lang(ja) .retro-btn.attack-btn {
                font-size: 1.0rem; /* Restore original size for desktop */
            }
        }
        body:lang(en) .retro-btn.attack-btn {
            /* MODIFIED: Made attack buttons full width */
            font-size: 0.55rem; /* NEW: Made even smaller for mobile */
            width: 100%;
        }
        @media (min-width: 768px) {
            body:lang(en) .retro-btn.attack-btn {
                font-size: 0.75rem; /* Restore original size for desktop */
            }
        }
        /* MODIFIED: Make Japanese attack buttons full width too */
        body:lang(ja) .retro-btn.attack-btn {
            width: 100%;
        }


        /* --- HP Bar Styling --- */
        .hp-bar-outer {
            background-color: #e0e0e0;
            border-radius: 9999px;
            overflow: hidden;
            border: 2px solid #333;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .hp-bar-inner {
            height: 100%;
            border-radius: 9999px;
            transition: width 0.5s ease-in-out;
            /* Green to Yellow to Red gradient */
            background: linear-gradient(90deg, #dc2626, #f59e0b, #22c55e);
            background-size: 300% 100%; /* Size to show only one part */
            background-position: 0% 50%; /* Start at green (right side) */
        }

        /* --- Retro Button Styling --- */
        .retro-btn {
            font-weight: 400; /* This font only has one weight */
            background-color: #4a5568; /* Default gray */
            color: white;
            border: 2px solid #1a202c;
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 0 #1a202c; /* 3D effect */
            transition: all 0.1s ease-in-out;
            transform: translateY(0);
        }

        /* The user requested an orange highlight on click */
        .retro-btn:active {
            background-color: #dd6b20; /* Orange */
            box-shadow: 0 2px 0 #1a202c;
            transform: translateY(2px); /* Button press effect */
        }

        .retro-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
            background-color: #2d3748; /* Darker gray for disabled */
            color: #718096;
            box-shadow: 0 4px 0 #1a202c;
        }

        /* --- Heavy Attack Button States --- */
        .heavy-attack-disabled {
            background-color: #2d3748; /* Darker gray */
            color: #718096;
            box-shadow: 0 4px 0 #1a202c;
            opacity: 0.6;
            pointer-events: none; /* Not clickable */
        }

        .heavy-attack-ready {
            background-color: #c53030; /* Ready state - red */
            color: white;
        }
        .heavy-attack-ready:active {
            background-color: #dd6b20; /* Still orange on click */
        }

        /* --- Battle Log --- */
        .battle-log {
            background-color: rgba(0, 0, 0, 0.7);
            border: 2px solid #4a5568;
            border-radius: 8px;
            overflow-y: auto;
            color: #f0f0f0;
        }
        .battle-log p {
            padding: 4px 8px;
            border-bottom: 1px dashed #4a5568;
        }
        .battle-log p:last-child {
            border-bottom: none;
        }

        /* --- Screen Transitions --- */
        .hidden {
            display: none;
        }

        /* --- Victory Overlay --- */
        .victory-text-base {
            font-weight: 400; /* This font only has one weight */
            font-size: 2.5rem; /* Smaller base size for pixel font */
        }

        /* Victory Animation */
        .victory-text-win {
            color: white;
            text-shadow: 
                -3px -3px 0 #000, 3px -3px 0 #000,
                -3px 3px 0 #000, 3px 3px 0 #000,
                -4px 0 0 #ffcc00, 4px 0 0 #ffcc00,
                0 -4px 0 #ffcc00, 0 4px 0 #ffcc00;
            animation: bounce 1s ease-in-out infinite;
        }
        
        /* Defeat Animation */
        .victory-text-lose {
            color: #dc2626; /* Red */
            text-shadow: 
                -2px -2px 0 #000, 2px -2px 0 #000,
                -2px 2px 0 #000, 2px 2px 0 #000,
                -3px 0 0 #000, 3px 0 0 #000,
                0 -3px 0 #000, 0 3px 0 #000;
            animation: tremble 0.5s linear infinite;
        }

        /* Draw Style (No Animation) */
        .victory-text-draw {
            color: #a0aec0; /* Gray */
            text-shadow: 
                -2px -2px 0 #000, 2px -2px 0 #000,
                -2px 2px 0 #000, 2px 2px 0 #000;
        }


        @media (min-width: 768px) {
            .victory-text-base {
                font-size: 5rem; /* Restore large size on desktop */
            }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes tremble {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-2px, 2px); }
            50% { transform: translate(2px, -2px); }
            75% { transform: translate(-2px, 2px); }
            100% { transform: translate(0, 0); }
        }


        /* --- Pokémon Sprite Animations --- */
        .pokemon-sprite {
            transition: transform 0.2s ease;
            image-rendering: pixelated; /* Keeps placeholders sharp */
        }
        .pokemon-sprite.taking-damage {
            animation: shake 0.3s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        .pokemon-sprite.attacking {
            transform: scale(1.1) translateX(10px);
        }
        .pokemon-sprite.ai-attacking {
            transform: scale(1.1) translateX(-10px);
        }

        /* --- Selection Card --- */
        .pokemon-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .pokemon-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2), 0 4px 6px -2px rgba(0, 0, 0, 0.1);
        }
        
        /* --- Pokeball Logo --- */
        .pokeball-logo {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 50px;
            height: 50px;
            z-index: 100;
            animation: spin 8s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* --- Maintenance Button --- */
        .maintenance-btn {
            position: relative;
            overflow: hidden; /* To keep the bar inside */
        }
        .maintenance-btn::after {
            content: attr(data-maintenance-text); /* Get text from data attribute */
            position: absolute;
            left: -100%;
            top: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: repeating-linear-gradient(
                -45deg,
                #ffcc00,
                #ffcc00 10px,
                #333 10px,
                #333 20px
            );
            color: white;
            text-shadow: 1px 1px 2px black;
            font-size: 0.75em; /* Smaller text for the bar */
            animation: maintenance-sweep 2s ease-in-out infinite;
        }

        @keyframes maintenance-sweep {
            0% { left: -100%; }
            40% { left: 0; }
            60% { left: 0; }
            100% { left: 100%; }
        }

        /* --- Pokémon Type Styles --- */
        .type-electric-text { color: #F8D030; text-shadow: 1px 1px #A1871F; }
        .type-electric-bg { background-color: rgba(248, 208, 48, 0.15); }
        .type-electric-border { border-color: #F8D030; }
        .type-electric-btn { background-color: #f7d02c; color: #333; }
        .type-electric-btn:active { background-color: #dd6b20 !important; }

        .type-fire-text { color: #F08030; text-shadow: 1px 1px #9C531F; }
        .type-fire-bg { background-color: rgba(240, 128, 48, 0.15); }
        .type-fire-border { border-color: #F08030; }
        .type-fire-btn { background-color: #f08030; color: white; }
        .type-fire-btn:active { background-color: #dd6b20 !important; }

        .type-water-text { color: #6890F0; text-shadow: 1px 1px #445E9C; }
        .type-water-bg { background-color: rgba(104, 144, 240, 0.15); }
        .type-water-border { border-color: #6890F0; }
        .type-water-btn { background-color: #6890f0; color: white; }
        .type-water-btn:active { background-color: #dd6b20 !important; }

        .type-grass-text { color: #78C850; text-shadow: 1px 1px #4E8234; }
        .type-grass-bg { background-color: rgba(120, 200, 80, 0.15); }
        .type-grass-border { border-color: #78C850; }
        .type-grass-btn { background-color: #78c850; color: white; }
        .type-grass-btn:active { background-color: #dd6b20 !important; }

        .type-normal-text { color: #A8A878; text-shadow: 1px 1px #6D6D4E; }
        .type-normal-bg { background-color: rgba(168, 168, 120, 0.15); }
        .type-normal-border { border-color: #A8A878; }
        .type-normal-btn { background-color: #a8a878; color: white; }
        .type-normal-btn:active { background-color: #dd6b20 !important; }

        /* --- Language Button --- */
        #language-toggle {
            position: fixed;
            bottom: 16px;
            right: 16px;
            z-index: 100;
            padding: 0.5rem 0.75rem;
        }

        /* --- NEW: Help Screen Styles --- */
        .help-screen {
            background-color: rgba(0, 0, 0, 0.9); /* Dark overlay */
            color: #f0f0f0;
            padding: 1.5rem;
            border-radius: 8px;
            border: 2px solid #4a5568;
            text-transform: none; /* Allow normal case for rules */
        }
        .help-screen h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #ffcc00; /* Yellow title */
            text-shadow: 2px 2px #000;
        }
        .help-screen ul {
            list-style-type: none;
            padding: 0;
            margin-left: 0.5rem;
        }
        .help-screen li {
            margin-bottom: 0.75rem;
            line-height: 1.6;
            font-size: 0.9rem;
        }
        /* Style the numbers/icons */
        .help-screen li::before {
            content: '▶';
            color: #ffcc00;
            margin-right: 0.75rem;
            font-size: 0.75rem;
        }
        /* Special style for heavy attack rule */
        .help-screen .heavy-rule {
            color: #fca5a5; /* Light red */
        }
        .help-screen .heavy-rule::before {
            content: '★';
            color: #f87171; /* Red */
        }

        /* --- NEW: Video Overlay --- */
        #video-overlay {
            z-index: 200; /* On top of everything */
        }
        /* NEW: Make log review overlay appear on top */
        #log-review-overlay {
            z-index: 210; /* On top of victory screen */
        }
        #attack-video {
            border: 4px solid #ffcc00; /* Retro yellow border */
            border-radius: 8px;
            max-width: 90%;
            max-height: 90%;
            background-color: #000; /* Black bg in case video is letterboxed */
        }

        /* --- NEW: Starfield Background --- */
        @keyframes move-stars-bg {
            from { background-position: 0 0; }
            to { background-position: 0 1000px; }
        }

        #star-background {
            position: fixed;
            inset: 0;
            z-index: 0; /* Behind everything */
            pointer-events: none; /* Not clickable */
        }

        #stars-small, #stars-medium, #stars-large {
            position: absolute;
            inset: 0;
            animation: move-stars-bg linear infinite;
        }

        /* Small, fast-moving stars */
        #stars-small {
            background-image: 
                radial-gradient(1px 1px at 20px 30px, #fff, transparent),
                radial-gradient(1px 1px at 80px 120px, #fff, transparent),
                radial-gradient(1px 1px at 150px 70px, #fff, transparent);
            background-size: 200px 200px;
            animation-duration: 50s;
        }
        
        /* Medium, slower stars */
        #stars-medium {
            background-image: 
                radial-gradient(2px 2px at 50px 100px, #eee, transparent),
                radial-gradient(2px 2px at 200px 30px, #eee, transparent),
                radial-gradient(2px 2px at 120px 180px, #eee, transparent);
            background-size: 250px 250px;
            animation-duration: 100s;
            animation-direction: reverse; /* Move a different way */
        }
        
        /* Large, very slow stars */
        #stars-large {
            background-image: 
                radial-gradient(3px 3px at 70px 50px, #ddd, transparent),
                radial-gradient(3px 3px at 180px 150px, #ddd, transparent);
            background-size: 300px 300px;
            animation-duration: 150s;
        }

        /* --- NEW: Moving Rocket --- */
        #moving-rocket {
            position: fixed;
            width: 120px; /* UPDATED: Made 2x larger */
            height: auto;
            z-index: 10; /* UPDATED: Moves behind game container */
            pointer-events: none; /* So it can't be clicked */
            animation: rocket-path 30s linear infinite;
            image-rendering: pixelated; /* Match theme */
        }

        @keyframes rocket-path {
            0% {
                top: -10%; /* Start off-screen */
                left: 10%;
                transform: rotate(45deg);
            }
            25% {
                top: 40%;
                left: 80%;
                transform: rotate(135deg); /* Turn */
            }
            50% {
                top: 110%; /* Go off-screen bottom */
                left: 70%;
                transform: rotate(225deg);
            }
            75% {
                top: 50%;
                left: -10%; /* Enter from left */
                transform: rotate(315deg);
            }
            100% {
                top: -10%; /* Return to start */
                left: 10%;
                transform: rotate(405deg); /* Complete the spin */
            }
        }

    </style>
</head>
<!-- Set default language for the body -->
<body lang="en" class="flex flex-col items-center justify-center min-h-screen p-4">

        /**
         * NEW: Hides the Help screen and returns to start.
         */
        function hideHelpScreen() {
            helpScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
            mainTitle.classList.remove('hidden');
            updateAllText(); // Update start screen text
        }


        /**
        * Renders the *single* current Pokémon card for the slider.
        */
        function renderCurrentPokemonCard() {
            pokemonCardDisplay.innerHTML = ''; // Clear old card
            
            // Get pokemon data for the correct language
            const pokemon = POKEMON_DATA[currentLanguage][currentSelectionIndex];
            const basePokemon = POKEMON_DATA['en'][currentSelectionIndex]; // For image/type
            
            const card = document.createElement('div');
            card.className = `pokemon-card bg-gray-200/70 p-2 md:p-4 rounded-lg border-2 border-gray-400 shadow-md text-center cursor-pointer w-full type-${basePokemon.type}-bg`;
            card.innerHTML = `
                <img src="${basePokemon.image}" alt="${pokemon.name}" class="w-24 h-24 md:w-48 md:h-48 rounded-full mx-auto mb-1 md:mb-2 border-2 md:border-4 border-gray-500">
                <h3 class="text-sm md:text-lg font-normal mb-1 md:mb-2 truncate type-${basePokemon.type}-text">${pokemon.name}</h3>
            `;
            
            card.addEventListener('click', () => selectPokemon(basePokemon.id));
            pokemonCardDisplay.appendChild(card);
        }

        /**
        * Shows the previous Pokémon in the slider.
        */
        function showPrevPokemon() {
            if (currentSelectionIndex > 0) {
                currentSelectionIndex--;
                renderCurrentPokemonCard();
                updateSliderButtons();
            }
        }

        /**
        * Shows the next Pokémon in the slider.
        */
        function showNextPokemon() {
            if (currentSelectionIndex < POKEMON_DATA['en'].length - 1) {
                currentSelectionIndex++;
                renderCurrentPokemonCard();
                updateSliderButtons();
            }
        }

        /**
        * Updates the disabled state of the slider buttons.
        */
        function updateSliderButtons() {
            prevPokemonButton.disabled = (currentSelectionIndex === 0);
            nextPokemonButton.disabled = (currentSelectionIndex === POKEMON_DATA['en'].length - 1);
        }

        /**
        * Handles the player's Pokémon selection.
        * @param {number} pokemonId - The ID of the chosen Pokémon.
        */
        function selectPokemon(pokemonId) {
            // We use the 'en' data as the master list, language data is for display
            playerPokemon = POKEMON_DATA['en'].find(p => p.id === pokemonId);
            
            // AI selects a different Pokémon
            const aiChoices = POKEMON_DATA['en'].filter(p => p.id !== pokemonId);
            aiPokemon = aiChoices[Math.floor(Math.random() * aiChoices.length)];

            startBattle();
        }

        /**
        * Sets up and starts the battle.
        */
        function startBattle() {
            gameInProgress = true;
            selectionScreen.classList.add('hidden');
            battleScreen.classList.remove('hidden');
            
            // Hide the main title
            mainTitle.classList.add('hidden');

            // Show the end game button
            endGameButton.textContent = getText('end_game');
            endGameButton.classList.remove('hidden');

            // Setup UI
            const playerLangData = POKEMON_DATA[currentLanguage].find(p => p.id === playerPokemon.id);
            const aiLangData = POKEMON_DATA[currentLanguage].find(p => p.id === aiPokemon.id);
            
            playerPokemonName.textContent = playerLangData.name;
            playerPokemonImg.src = playerPokemon.image;
            playerPokemonName.className = `text-[0.625rem] md:text-base font-normal leading-tight text-center md:text-left type-${playerPokemon.type}-text`; // Added mobile text-center
            playerBox.className = `p-1 md:p-4 rounded-lg border-2 shadow-md type-${playerPokemon.type}-bg type-${playerPokemon.type}-border`;
            
            aiPokemonName.textContent = aiLangData.name;
            aiPokemonImg.src = aiPokemon.image;
            aiPokemonName.className = `text-[0.625rem] md:text-base font-normal leading-tight text-center md:text-left type-${aiPokemon.type}-text`; // Added mobile text-center
            aiBox.className = `p-1 md:p-4 rounded-lg border-2 shadow-md type-${aiPokemon.type}-bg type-${aiPokemon.type}-border`;

            // Setup player attack buttons
            createAttackButtons();

            // Reset log
            battleLog.innerHTML = '';
            logMessage(getText('log_player_chose', playerLangData.name));
            logMessage(getText('log_ai_chose', aiLangData.name));
            logMessage(getText('log_battle_begin'));
            
            // Update all text fields
            yourTurnTitle.textContent = getText('your_turn');
            battleLogTitle.textContent = getText('battle_log');
            
            updateUI();
        }

        /**
         * NEW: Creates and populates attack buttons.
         */
        function createAttackButtons() {
            playerControls.innerHTML = '';
            const playerLangData = POKEMON_DATA[currentLanguage].find(p => p.id === playerPokemon.id);
            
            playerLangData.attacks.forEach((attack, index) => {
                const baseAttack = playerPokemon.attacks[index]; // Get base data for type
                const button = document.createElement('button');
                button.textContent = attack.name;
                // MODIFIED: Added w-full, and changed mobile padding from p-2 to px-2 pt-2 pb-3
                button.className = `retro-btn !leading-tight !px-2 !pt-2 !pb-3 md:!p-4 attack-btn type-${playerPokemon.type}-btn w-full`; // UPDATED: !p-2 -> !px-2 !pt-2 !pb-3
                
                if (baseAttack.type === 'heavy') {
                    button.id = 'heavy-attack-btn';
                    button.classList.add('heavy-attack-disabled'); // Start disabled
                    button.classList.remove(`type-${playerPokemon.type}-btn`); // Use default heavy styles
                }
                button.addEventListener('click', () => playerAttack(index));
                playerControls.appendChild(button);
            });
        }

        /**
         * NEW: Generates a video file name from an attack name.
         * e.g., "Volt Tackle" -> "./volt-tackle.mp4"
         * @param {string} attackName - The English attack name.
         * @returns {string} The formatted video file name.
         */
        function getAttackVideoSrc(attackName) {
            // Assumes videos are in the same folder, named like 'quick-attack.mp4'
            return './' + attackName.toLowerCase().replace(/\s+/g, '-') + '.mp4';
        }


        /**
        * Handles the player's attack action.
        * @param {number} attackIndex - The index of the attack in the Pokémon's attack array.
        */
        function playerAttack(attackIndex) {
            if (!isPlayerTurn || !gameInProgress) return;

            const attack = playerPokemon.attacks[attackIndex];
            // Get both translated and base-English attack names
            const attackName = POKEMON_DATA[currentLanguage].find(p => p.id === playerPokemon.id).attacks[attackIndex].name;
            const baseAttackName = POKEMON_DATA['en'].find(p => p.id === playerPokemon.id).attacks[attackIndex].name;
            const pokemonName = POKEMON_DATA[currentLanguage].find(p => p.id === playerPokemon.id).name;

            // Check heavy attack rule
            if (attack.type === 'heavy' && playerHP >= 50) {
                logMessage(getText('log_heavy_fail', attackName));
                return; // Don't waste the turn
            }
            
            isPlayerTurn = false;
            updateUI(); // Disable buttons immediately
            logMessage(getText('log_player_command', pokemonName, attackName));
            
            // --- NEW VIDEO LOGIC ---
            const videoSrc = getAttackVideoSrc(baseAttackName);
            attackVideo.src = videoSrc;
            attackVideo.muted = true; // Ensure muted for autoplay
            // videoOverlay.classList.remove('hidden'); // <-- MOVED

            // NEW: Listen for 'playing' event to unhide the overlay
            const onPlaying = () => {
                videoOverlay.classList.remove('hidden'); // Unhide *now*
                attackVideo.removeEventListener('playing', onPlaying); // Clean up
            };
            attackVideo.addEventListener('playing', onPlaying);
            
            // The rest of the logic happens *after* the video plays (or fails)
            attackVideo.onended = () => {
                attackVideo.onended = null; // <-- FIX: Prevent double-fire
                attackVideo.removeEventListener('playing', onPlaying); // <-- NEW: Clean up on success
                videoOverlay.classList.add('hidden'); // Hide overlay
                animateAttack(playerPokemonImg, true); // Play sprite wiggle

                // Check for miss
                const missReasons = MISS_MESSAGES[currentLanguage];
                if (Math.random() < MISS_CHANCE) {
                    logMessage(getText('log_miss', missReasons[Math.floor(Math.random() * missReasons.length)]));
                } else {
                    const damage = attack.damage;
                    aiHP = Math.max(0, aiHP - damage);
                    logMessage(getText('log_hit', attackName, damage));
                    animateDamage(aiPokemonImg);
                }
                updateUI();
                
                // Check for AI KO
                if (checkGameOver()) return;
                
                // AI's turn
                setTimeout(aiTurn, 1500); // Wait 1.5s before AI attacks
            };

            attackVideo.play().catch(e => {
                // Handle cases where play() is interrupted or fails
                console.warn("Video play failed:", e);
                attackVideo.removeEventListener('playing', onPlaying); // <-- NEW: Clean up on catch
                // Manually trigger the onended logic to continue the game
                if(attackVideo.onended) attackVideo.onended();
            });
            // --- END NEW VIDEO LOGIC ---
        }

        /**
        * Simulates the AI's turn and logic.
        */
        function aiTurn() {
            if (!gameInProgress) return;

            const { attack, attackName, pokemonName } = getAiAttack();
            
            logMessage(getText('log_ai_attack', pokemonName, attackName));

            // --- NEW VIDEO LOGIC ---
            const videoSrc = getAttackVideoSrc(attack.name); // Use the English name from the object
            attackVideo.src = videoSrc;
            attackVideo.muted = true; // Ensure muted for autoplay
            // videoOverlay.classList.remove('hidden'); // <-- MOVED

            // NEW: Listen for 'playing' event to unhide the overlay
            const onPlayingAI = () => {
                videoOverlay.classList.remove('hidden'); // Unhide *now*
                attackVideo.removeEventListener('playing', onPlayingAI); // Clean up
            };
            attackVideo.addEventListener('playing', onPlayingAI);

            // The rest of the logic happens *after* the video plays
            attackVideo.onended = () => {
                attackVideo.onended = null; // <-- FIX: Prevent double-fire
                attackVideo.removeEventListener('playing', onPlayingAI); // <-- NEW: Clean up on success
                videoOverlay.classList.add('hidden'); // Hide overlay
                animateAttack(aiPokemonImg, false); // Play sprite wiggle

                // Check for miss
                const missReasons = MISS_MESSAGES[currentLanguage];
                if (Math.random() < MISS_CHANCE) {
                    logMessage(getText('log_miss', missReasons[Math.floor(Math.random() * missReasons.length)]));
                } else {
                    const damage = attack.damage;
                    playerHP = Math.max(0, playerHP - damage);
                    logMessage(getText('log_hit', attackName, damage));
                    animateDamage(playerPokemonImg);
                }

                currentTurn++; // Increment turn *after* both player and AI have gone
                isPlayerTurn = true;
                updateUI();
                checkGameOver();
            };

            attackVideo.play().catch(e => {
                // Handle cases where play() is interrupted or fails
                console.warn("Video play failed:", e);
                attackVideo.removeEventListener('playing', onPlayingAI); // <-- NEW: Clean up on catch
                // Manually trigger the onended logic to continue the game
                if(attackVideo.onended) attackVideo.onended();
            });
            // --- END NEW VIDEO LOGIC ---
        }

        /**
        * "Smart" AI logic to select an attack.
        * @returns {object} An object containing the chosen attack, its translated name, and the AI pokemon's translated name.
        */
        function getAiAttack() {
            const attacks = aiPokemon.attacks;
            const heavyAttack = attacks.find(a => a.type === 'heavy');
            const mediumAttack = attacks.find(a => a.damage === 40 || a.damage === 30); // Broader search
            const basicAttacks = attacks.filter(a => a.damage === 20);
            
            const aiLangData = POKEMON_DATA[currentLanguage].find(p => p.id === aiPokemon.id);
            const pokemonName = aiLangData.name;
            let chosenAttack = null;

            // Rule 1: If AI HP < 50, high chance to use Heavy Attack.
            if (heavyAttack && aiHP < 50 && Math.random() < 0.75) { // 75% chance
                logMessage(getText('log_ai_focus', pokemonName));
                chosenAttack = heavyAttack;
            }
            // Rule 2: If Player HP is low, try to finish.
            else if (playerHP <= 40) {
                // Use heavy if available, otherwise medium
                chosenAttack = (heavyAttack && aiHP < 50) ? heavyAttack : (mediumAttack || basicAttacks[0]);
            }
            // Rule 3: If Player HP is very low, use medium to be safe
            else if (playerHP <= 20) {
                chosenAttack = mediumAttack || basicAttacks[0];
            }
            // Rule 4: Otherwise, random choice, weighted towards medium.
            else {
                const randomChoice = Math.random();
                if (mediumAttack && randomChoice < 0.4) { // 40% chance for medium
                    chosenAttack = mediumAttack;
                } else if (randomChoice < 0.7) { // 30% chance for basic 1
                    chosenAttack = basicAttacks[0];
                } else { // 30% chance for basic 2
                    chosenAttack = basicAttacks[1] || basicAttacks[0];
                }
            }
            
            // Failsafe in case logic fails
            if (!chosenAttack) {
                chosenAttack = basicAttacks[Math.floor(Math.random() * basicAttacks.length)];
            }


            // Find the index of the chosen attack to get its translated name
            const attackIndex = attacks.findIndex(a => a.name === chosenAttack.name);
            const attackName = aiLangData.attacks[attackIndex].name;
            
            return { attack: chosenAttack, attackName, pokemonName };
        }

        /**
        * Checks if the game is over due to KO or turns running out.
        * @returns {boolean} True if the game is over, false otherwise.
        */
        function checkGameOver() {
            if (!gameInProgress) return true; // Game already ended

            const playerLangName = POKEMON_DATA[currentLanguage].find(p => p.id === playerPokemon.id).name;
            const aiLangName = POKEMON_DATA[currentLanguage].find(p => p.id === aiPokemon.id).name;

            if (aiHP <= 0) {
                logMessage(getText('log_ai_fainted', aiLangName));
                showVictoryScreen(playerPokemon, 'victory');
                return true;
            }
            if (playerHP <= 0) {
                logMessage(getText('log_player_fainted', playerLangName));
                showVictoryScreen(aiPokemon, 'defeat');
                return true;
            }

            if (currentTurn > MAX_TURNS) {
                logMessage(getText('log_times_up'));
                if (playerHP > aiHP) {
                    logMessage(getText('log_player_hp_win'));
                    showVictoryScreen(playerPokemon, 'victory');
                } else if (aiHP > playerHP) {
                    logMessage(getText('log_ai_hp_win'));
                    showVictoryScreen(aiPokemon, 'defeat');
                } else {
                    logMessage(getText('log_draw'));
                    showVictoryScreen(null, 'draw');
                }
                return true;
            }
            return false;
        }

        /**
        * Updates all dynamic UI elements (HP bars, text, buttons).
        */
        function updateUI() {
            // Update HP Text
            playerHpText.textContent = getText('hp_text', playerHP, 100);
            aiHpText.textContent = getText('hp_text', aiHP, 100);
            
            // Update HP bar color and width
            updateHpBar(playerHpBar, playerHP);
            updateHpBar(aiHpBar, aiHP);

            // Update Turn Counter
            turnCounter.textContent = getText('turn_counter', Math.min(currentTurn, MAX_TURNS), MAX_TURNS);

            // Update Attack Buttons
            const heavyBtn = document.getElementById('heavy-attack-btn');
            if (heavyBtn) {
                if (playerHP < 50) {
                    heavyBtn.classList.remove('heavy-attack-disabled');
                    heavyBtn.classList.add('heavy-attack-ready');
                    heavyBtn.disabled = false;
                } else {
                    heavyBtn.classList.add('heavy-attack-disabled');
                    heavyBtn.classList.remove('heavy-attack-ready');
                    heavyBtn.disabled = true; // Also set disabled property
                }
            }

            // Disable all buttons if not player's turn or game is over
            playerControls.querySelectorAll('button').forEach(btn => {
                if (btn.id !== 'heavy-attack-btn') { // Don't override heavy logic
                    btn.disabled = !isPlayerTurn || !gameInProgress;
                }
                if (btn.id === 'heavy-attack-btn' && playerHP >= 50) {
                    btn.disabled = true; // Ensure heavy stays disabled
                }
                if (!isPlayerTurn || !gameInProgress) {
                    btn.disabled = true; // Master disable
                }
            });
        }

        /**
        * Updates an HP bar's width and color based on percentage.
        * @param {HTMLElement} barElement - The .hp-bar-inner element.
        * @param {number} currentHp - The current HP value (0-100).
        */
        function updateHpBar(barElement, currentHp) {
            const hpPercent = currentHp / 100;
            barElement.style.width = `${currentHp}%`;
            
            // Update gradient position
            // 100% HP = 0% position (all green)
            // 50% HP = 50% position (all yellow)
            // 0% HP = 100% position (all red)
            const backgroundPosition = 100 - (hpPercent * 100);
            barElement.style.backgroundPosition = `${backgroundPosition}% 50%`;
        }


        /**
        * Displays the victory screen.
        * @param {object | null} winner - The winning Pokémon object, or null for a draw.
        * @param {string} messageKey - The key for the result text (victory, defeat, draw).
        */
        function showVictoryScreen(winner, messageKey) {
            gameInProgress = false;

            // NEW: Capture the final log *before* hiding the battle screen
            logReviewContent.innerHTML = battleLog.innerHTML;
            logReviewContent.scrollTop = logReviewContent.scrollHeight; // Scroll to bottom
            
            // Hide the end game button
            endGameButton.classList.add('hidden');
            
            // Store the result key for re-translation
            victoryScreen.dataset.result = messageKey;
            
            if (winner) {
                winnerImg.src = winner.image.replace('150x150', '320x320'); // Get larger image
                // Set type-specific border
                winnerImg.className = `w-full h-full object-cover rounded-full shadow-lg border-8 type-${winner.type}-border`;
            } else {
                winnerImg.src = 'https://placehold.co/320x320/EFEFEF/333?text=DRAW';
                winnerImg.className = 'w-full h-full object-cover rounded-full shadow-lg border-8 border-gray-500';
            }
            
            // Set text and animation class
            victoryText.textContent = getText(messageKey);
            victoryText.className = 'victory-text-base'; // Reset
            if (messageKey === 'victory') {
                victoryText.classList.add('victory-text-win');
            } else if (messageKey === 'defeat') {
                victoryText.classList.add('victory-text-lose');
            } else {
                victoryText.classList.add('victory-text-draw');
            }

            restartButton.textContent = getText('play_again');
            showLogButton.textContent = getText('view_log'); // NEW

            // Animate transition
            setTimeout(() => {
                battleScreen.classList.add('hidden');
                victoryScreen.classList.remove('hidden');

                // Hide the main title on victory
                mainTitle.classList.add('hidden');
            }, 1000); // Wait 1 sec after final message
        }

        /**
        * Adds a message to the battle log and scrolls down.
        * @param {string} message - The text to log.
        * @param {boolean} [forceClear=false] - If true, clears the log first.
        */
        function logMessage(message, forceClear = false) {
            if (forceClear) {
                battleLog.innerHTML = '';
            }
            const p = document.createElement('p');
            p.textContent = message;
            battleLog.appendChild(p);
            battleLog.scrollTop = battleLog.scrollHeight; // Auto-scroll
        }

        /**
        * Handles manually ending the game (forfeit).
        */
        function endGame() {
            if (!gameInProgress) return; // Don't do anything if battle isn't running

            gameInProgress = false;
            logMessage(getText('log_forfeit'));
            
            // Show AI as winner
            setTimeout(() => {
                showVictoryScreen(aiPokemon, 'defeat');
            }, 500); // Short delay for the message to be read
            updateUI(); // Disable all buttons
        }

        /**
        * Triggers a visual "damage" animation.
        * @param {HTMLElement} imgElement - The <img> element to animate.
        */
        function animateDamage(imgElement) {
            imgElement.classList.add('taking-damage');
            setTimeout(() => {
                imgElement.classList.remove('taking-damage');
            }, 300); // Duration of animation
        }

        /**
        * Triggers a visual "attack" animation.
        * @param {HTMLElement} imgElement - The <img> element to animate.
        * @param {boolean} isPlayer - True if player, false if AI (for direction).
        */
        function animateAttack(imgElement, isPlayer) {
            const attackClass = isPlayer ? 'attacking' : 'ai-attacking';
            imgElement.classList.add(attackClass);
            setTimeout(() => {
                imgElement.classList.remove(attackClass);
            }, 200); // Duration of animation
        }


        // --- EVENT LISTENERS ---
        restartButton.addEventListener('click', initGame);
        endGameButton.addEventListener('click', endGame);
        playAiButton.addEventListener('click', showSelectionScreen);
        helpButton.addEventListener('click', showHelpScreen); // NEW
        helpBackButton.addEventListener('click', hideHelpScreen); // NEW

        prevPokemonButton.addEventListener('click', showPrevPokemon);
        nextPokemonButton.addEventListener('click', showNextPokemon);

        languageToggleButton.addEventListener('click', toggleLanguage);

        // NEW: Log Review Listeners
        showLogButton.addEventListener('click', () => {
            logReviewOverlay.classList.remove('hidden');
            // Ensure text is correct if language was toggled on victory screen
            logReviewTitle.textContent = getText('log_review_title');
            closeLogButton.textContent = getText('help_back');
            logReviewContent.scrollTop = logReviewContent.scrollHeight; // Scroll to bottom
        });
        closeLogButton.addEventListener('click', () => {
            logReviewOverlay.classList.add('hidden');
        });


        // NEW: Handle video errors so the game doesn't hang
        attackVideo.onerror = () => {
            console.warn('Video file not found or failed to load. Skipping animation.');
            // Manually trigger the onended logic to continue the game
            if (typeof attackVideo.onended === 'function') {
                attackVideo.onended(); 
            }
            videoOverlay.classList.add('hidden'); // Ensure overlay is hidden
        };

        // --- START GAME ---
        document.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
