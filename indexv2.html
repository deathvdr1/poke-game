<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAY. WATCHING.</title>
    <!-- Import the scary font --><link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
    <!-- Import three.js --><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- Firebase SDK Imports -->
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, setLogLevel, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- FIREBASE GLOBALS ---
        let db, auth, appId, userId;
        let isAuthReady = false;

        // --- ASYNC FIREBASE INIT ---
        async function initializeFirebase() {
            try {
                // DO NOT PROMPT FOR, OR CHANGE THESE.
                appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
                const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
                const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                
                // Set log level for debugging
                setLogLevel('Debug');

                // Listen for auth state changes
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        userId = user.uid;
                        console.log("User is signed in:", userId);
                    } else {
                        userId = null;
                        console.log("User is signed out.");
                    }
                    isAuthReady = true;
                    // Enable buttons that require auth
                    hallOfReButton.disabled = false;
                });

                // Sign in
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }

            } catch (error) {
                console.error("Firebase Initialization Error:", error);
                // Show error to user on overlay
                const statusContent = document.getElementById('statusContent');
                if(statusContent) {
                    statusContent.innerHTML = `<p style="color:yellow;">Error: Could not connect to database. Leaderboard will be unavailable.</p>`;
                }
            }
        }
        
        // --- GAME SCRIPT ---
        // Expose game functions to the module global scope so HTML listeners can find them
        window.startGame = startGame;
        window.showHallOfRe = showHallOfRe;
        window.hideHallOfRe = hideHallOfRe;

        // --- SCENE SETUP ---
        let scene, camera, renderer, clock;
        let playerHeight = 5; // Height of player camera
        
        // --- GAME OBJECTS ---
        let redacted1, redacted2, redacted3, walls = [], flickerLight;
        let redacteds = []; // Array to hold all monsters
        let redactedMaterial, statueMaterial;
        let redacted2Spawned = false;
        let redacted3Spawned = false;

        // --- GAME STATE ---
        let gameState = "menu"; // "menu", "playing", "won", "lost"
        let timeLeft = 300; // 5 minutes in seconds
        let keys = {}; // To track key presses
        let cameraRotation = new THREE.Euler(0, 0, 0, 'YXZ');
        let raycaster = new THREE.Raycaster();

        // --- UI ELEMENTS ---
        const overlay = document.getElementById('overlay');
        const statusTitle = document.getElementById('statusTitle');
        const statusContent = document.getElementById('statusContent'); // Changed from statusMessage
        const startButton = document.getElementById('startButton');
        const hallOfReButton = document.getElementById('hallOfReButton');
        const hallOfReOverlay = document.getElementById('hallOfReOverlay');
        const scoreList = document.getElementById('scoreList');
        const uiElement = document.getElementById('ui');
        const timerElement = document.getElementById('timer');
        const messageElement = document.getElementById('message');
        const crosshair = document.getElementById('crosshair');

        // --- CONSTANTS ---
        const PLAYER_SPEED = 15.0;
        const REDACTED_SPEED = 20.0; // Faster than player
        const CATCH_DISTANCE = 4.0; // How close monster needs to be to catch
        const PLAYER_SIZE = 1.0; // Player bounding box half-width

        function init() {
            // Start Firebase Auth
            initializeFirebase();

            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050000); // Very dark red
            scene.fog = new THREE.Fog(0x050000, 10, 80); // Dense, dark fog

            // Clock
            clock = new THREE.Clock();

            // Camera (Player)
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, playerHeight, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // --- LIGHTING ---
            scene.add(new THREE.AmbientLight(0x400000)); // Dim red
            flickerLight = new THREE.PointLight(0xff0000, 0.8, 100, 2);
            flickerLight.position.set(0, 15, 0);
            flickerLight.castShadow = true;
            scene.add(flickerLight);

            // --- MATERIALS ---
            redactedMaterial = new THREE.MeshStandardMaterial({
                color: 0x660000, roughness: 0.8, metalness: 0.1
            });
            statueMaterial = new THREE.MeshStandardMaterial({
                color: 0x444444, roughness: 0.9, metalness: 0.0
            });

            // --- CREATE WORLD ---
            createEnvironment();
            
            // Create all three redacted creatures
            redacted1 = createRedacted();
            redacted2 = createRedacted();
            redacted3 = createRedacted();
            redacteds.push(redacted1, redacted2, redacted3);
            
            scene.add(redacted1); // Add the first one to the scene
            // Others will be added later

            // --- EVENT LISTENERS ---
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', (e) => keys[e.code] = true);
            document.addEventListener('keyup', (e) => keys[e.code] = false);
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('pointerlockchange', onPointerLockChange);
            
            // Set initial button states
            hallOfReButton.disabled = true; // Disabled until auth is ready
        }

        function createEnvironment() {
            // Ground
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 1.0 });
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);
            
            // Outer walls
            addWall(200, 20, 2, 0, 10, -100); // Back
            addWall(200, 20, 2, 0, 10, 100);  // Front
            addWall(2, 20, 200, -100, 10, 0); // Left
            addWall(2, 20, 200, 100, 10, 0);  // Right

            // Internal "machinery" (obstacles)
            addWall(10, 15, 10, 20, 7.5, 20);
            addWall(15, 10, 15, -30, 5, -10);
            addWall(8, 20, 8, -15, 10, 40);
            addWall(20, 10, 10, 40, 5, -30);
            addWall(10, 12, 30, -50, 6, 50);
            addWall(30, 8, 10, 60, 4, 10);
        }

        function addWall(width, height, depth, x, y, z) {
            const wall = new THREE.Mesh(
                new THREE.BoxGeometry(width, height, depth),
                new THREE.MeshStandardMaterial({ color: 0x3a1f0a, roughness: 0.9 })
            );
            wall.position.set(x, y, z);
            wall.castShadow = true;
            wall.receiveShadow = true;
            scene.add(wall);
            walls.push(wall);
        }

        function createRedacted() {
            const redacted = new THREE.Group();
            const body = new THREE.Mesh(new THREE.SphereGeometry(3, 16, 16), redactedMaterial);
            body.castShadow = true;
            redacted.add(body);

            // Eyes
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xFFFF00 });
            const eye1 = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 8), eyeMat);
            eye1.position.set(1, 1, 2.5);
            eye1.name = "eye";
            const eye2 = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 8), eyeMat);
            eye2.position.set(-1, 1, 2.5);
            eye2.name = "eye";
            redacted.add(eye1);
            redacted.add(eye2);

            // Mouth (initially closed)
            const mouthGeo = new THREE.SphereGeometry(1.5, 16, 16, 0, Math.PI * 2, 0, Math.PI / 4);
            const mouth = new THREE.Mesh(mouthGeo, new THREE.MeshStandardMaterial({ color: 0x440000, roughness: 0.7 }));
            mouth.position.set(0, -0.5, 2.5);
            mouth.rotation.x = Math.PI;
            mouth.scale.y = 0.1; // Initially thin/closed
            mouth.name = "mouth";
            redacted.add(mouth);

            // Teeth (long and sharp)
            const toothMat = new THREE.MeshStandardMaterial({ color: 0xFFFFFF, roughness: 0.5 });
            for (let i = 0; i < 6; i++) {
                const tooth = new THREE.Mesh(new THREE.ConeGeometry(0.15, 1.5, 4), toothMat); // Thinner (0.15) and longer (1.5)
                tooth.position.set(
                    Math.cos(i / 6 * Math.PI * 2) * 0.8,
                    -1.2,
                    Math.sin(i / 6 * Math.PI * 2) * 0.8 + 2.5
                );
                tooth.rotation.x = Math.PI / 2;
                tooth.scale.set(1, 1, 0.1); // Initially small/hidden
                tooth.name = "tooth";
                redacted.add(tooth);
            }

            // Blood drips
            const bloodMat = new THREE.MeshStandardMaterial({ color: 0x880000, roughness: 0.5 });
            for (let i = 0; i < 3; i++) {
                const bloodDrip = new THREE.Mesh(new THREE.SphereGeometry(0.1 + Math.random() * 0.1, 8, 8), bloodMat);
                bloodDrip.position.set(
                    (Math.random() - 0.5) * 2, -2, 2.5 + (Math.random() - 0.5) * 0.5
                );
                bloodDrip.name = "bloodDrip";
                bloodDrip.visible = false;
                redacted.add(bloodDrip);
            }

            // Tentacles
            const tentacleGeo = new THREE.CylinderGeometry(0.2, 0.5, 8, 8);
            for (let i = 0; i < 8; i++) {
                const tentacle = new THREE.Mesh(tentacleGeo, redactedMaterial);
                const angle = (i / 8) * Math.PI * 2;
                tentacle.position.set(
                    Math.sin(angle) * 2.5, -3, Math.cos(angle) * 2.5
                );
                tentacle.rotation.x = Math.PI / 4 + (Math.random() - 0.5) * 0.2;
                tentacle.rotation.z = (Math.random() - 0.5) * 0.2;
                tentacle.rotation.y = angle;
                tentacle.castShadow = true;
                redacted.add(tentacle);
            }
            return redacted;
        }
        
        function setRedactedState(redacted, isMoving) {
            redacted.traverse(child => {
                if (child.isMesh) {
                    if (child.name === 'eye') {
                        // eyes always visible
                    } else if (child.name === 'mouth') {
                        child.material = isMoving ? new THREE.MeshStandardMaterial({ color: 0x440000, roughness: 0.7 }) : new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.9 });
                        child.scale.y = isMoving ? 1.2 : 0.1; // Open/close mouth (1.2 is "more huge")
                    } else if (child.name === 'tooth') {
                        child.visible = isMoving;
                        child.scale.set(1, 1, isMoving ? 1 : 0.1); // Show/hide teeth
                    } else if (child.name === 'bloodDrip') {
                        child.visible = isMoving;
                    } else {
                        child.material = isMoving ? redactedMaterial : statueMaterial;
                    }
                }
            });
        }

        function startGame() {
            // Reset game state
            gameState = "playing";
            timeLeft = 300;
            camera.position.set(0, playerHeight, 0);
            
            // Reset redacted 1
            redacted1.position.set(50, playerHeight, 50);
            setRedactedState(redacted1, false); // Start as statue
            
            // Reset redacted 2
            redacted2.position.set(-50, playerHeight, -50);
            setRedactedState(redacted2, false);
            if (redacted2.parent === scene) scene.remove(redacted2);
            redacted2Spawned = false;

            // Reset redacted 3
            redacted3.position.set(50, playerHeight, -50);
            setRedactedState(redacted3, false);
            if (redacted3.parent === scene) scene.remove(redacted3);
            redacted3Spawned = false;

            // Hide overlay, show UI
            overlay.style.display = 'none';
            uiElement.style.display = 'block';
            crosshair.style.display = 'block';

            // Request pointer lock
            document.body.requestPointerLock();
            
            // Start game loop
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onMouseMove(event) {
            if (gameState !== 'playing' || document.pointerLockElement !== document.body) return;
            cameraRotation.y -= event.movementX * 0.002;
            cameraRotation.x -= event.movementY * 0.002;
            cameraRotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, cameraRotation.x));
            camera.quaternion.setFromEuler(cameraRotation);
        }
        
        function onPointerLockChange() {
            if (document.pointerLockElement !== document.body && gameState === 'playing') {
                gameOver(false, "You looked away... (Game Paused)");
            }
        }

        function animate() {
            if (gameState !== 'playing') return;
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            updateTimer(delta);
            updatePlayerMovement(delta);
            updateRedacteds(delta);
            checkGameOver();
            flickerLight.intensity = 0.5 + Math.sin(clock.elapsedTime * 10) * 0.3 + Math.random() * 0.2;
            renderer.render(scene, camera);
        }

        function updateTimer(delta) {
            timeLeft -= delta;
            if (timeLeft <= 0) {
                timeLeft = 0;
                gameOver(true); // Player wins
                return;
            }
            
            // Spawn second redacted when 4 minutes are left
            if (!redacted2Spawned && timeLeft <= 240) { // 60s * 4
                scene.add(redacted2);
                redacted2Spawned = true;
                messageElement.textContent = "SOMETHING ELSE IS HERE.";
            }
            
            // Spawn third redacted when 2 minutes are left
            if (!redacted3Spawned && timeLeft <= 120) { // 60s * 2
                scene.add(redacted3);
                redacted3Spawned = true;
                messageElement.textContent = "ANOTHER ONE... RUN!";
            }
            
            const minutes = Math.floor(timeLeft / 60);
            const seconds = Math.floor(timeLeft % 60);
            timerElement.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }
        
        function updatePlayerMovement(delta) {
            const moveSpeed = PLAYER_SPEED * delta;
            const velocity = new THREE.Vector3();
            const forward = new THREE.Vector3();
            camera.getWorldDirection(forward);
            forward.y = 0;
            forward.normalize();
            const right = new THREE.Vector3();
            right.crossVectors(camera.up, forward).normalize().negate();

            if (keys['KeyW']) velocity.add(forward);
            if (keys['KeyS']) velocity.sub(forward);
            if (keys['KeyA']) velocity.sub(right);
            if (keys['KeyD']) velocity.add(right);

            if (velocity.length() > 0) {
                velocity.normalize().multiplyScalar(moveSpeed);
                const oldPos = camera.position.clone();
                camera.position.x += velocity.x;
                if (checkWallCollision()) camera.position.x = oldPos.x;
                camera.position.z += velocity.z;
                if (checkWallCollision()) camera.position.z = oldPos.z;
            }
        }
        
        function checkWallCollision() {
            const playerBox = new THREE.Box3(
                new THREE.Vector3(camera.position.x - PLAYER_SIZE, 0, camera.position.z - PLAYER_SIZE),
                new THREE.Vector3(camera.position.x + PLAYER_SIZE, playerHeight, camera.position.z + PLAYER_SIZE)
            );
            for (const wall of walls) {
                const wallBox = new THREE.Box3().setFromObject(wall);
                if (playerBox.intersectsBox(wallBox)) return true;
            }
            return false;
        }

        function isPlayerLookingAtRedacted(redacted) {
            raycaster.setFromCamera({ x: 0, y: 0 }, camera);
            const intersects = raycaster.intersectObject(redacted, true);
            if (intersects.length > 0) {
                const distanceToRedacted = intersects[0].distance;
                const wallIntersects = raycaster.intersectObjects(walls);
                if (wallIntersects.length > 0 && wallIntersects[0].distance < distanceToRedacted) {
                    return false;
                }
                return true;
            }
            return false;
        }

        function updateRedacteds(delta) {
            let anyRedactedMoving = false;
            for (const redacted of redacteds) {
                if (redacted.parent !== scene) continue;
                const isLooking = isPlayerLookingAtRedacted(redacted);
                setRedactedState(redacted, !isLooking);
                if (!isLooking) {
                    anyRedactedMoving = true;
                    const redactedSpeed = REDACTED_SPEED * delta;
                    const direction = new THREE.Vector3().subVectors(camera.position, redacted.position);
                    direction.y = 0;
                    direction.normalize();
                    redacted.position.add(direction.multiplyScalar(redactedSpeed));
                    redacted.lookAt(camera.position.x, redacted.position.y, camera.position.z);
                }
            }
            if (anyRedactedMoving) {
                messageElement.textContent = "WHERE ARE THEY?!";
            } else {
                messageElement.textContent = "They're frozen. Good.";
            }
        }
        
        function checkGameOver() {
            for (const redacted of redacteds) {
                if (redacted.parent !== scene) continue;
                const distance = camera.position.distanceTo(redacted.position);
                if (distance < CATCH_DISTANCE) {
                    gameOver(false, "The creature's grasp is cold. Silence follows.");
                    return;
                }
            }
        }

        function gameOver(didWin, customMessage = "") {
            if (gameState !== 'playing') return;
            gameState = didWin ? "won" : "lost";
            
            overlay.style.display = 'flex';
            uiElement.style.display = 'none';
            crosshair.style.display = 'none';
            
            // Always show Hall of RE button on game end
            hallOfReButton.style.display = 'inline-block';
            
            if (didWin) {
                statusTitle.textContent = "YOU SURVIVED... FOR NOW";
                // Show input field and save button
                statusContent.innerHTML = `
                    <p>Enter your name to enter the "Hall of RE"</p>
                    <input type="text" id="playerNameInput" placeholder="SURVIVOR NAME">
                    <button id="saveScoreButton" class="overlayButton">SAVE</button>
                `;
                // Hide main game buttons
                startButton.style.display = 'none';
                hallOfReButton.style.display = 'none';
                
                document.getElementById('saveScoreButton').addEventListener('click', saveScore);
            } else {
                statusTitle.textContent = "YOU WERE CAUGHT";
                statusContent.innerHTML = `<p>${customMessage || "It found you in the dark."}</p>`;
                // Show main game buttons
                startButton.style.display = 'inline-block';
                startButton.textContent = "TRY AGAIN?";
            }
            
            document.exitPointerLock();
        }

        async function saveScore() {
            if (!isAuthReady || !userId) {
                statusContent.innerHTML = `<p style="color:yellow;">Error: Not connected to server. Cannot save score.</p>`;
                return;
            }
            
            const input = document.getElementById('playerNameInput');
            const button = document.getElementById('saveScoreButton');
            const playerName = input.value.trim() || "Anonymous Survivor";
            
            button.disabled = true;
            button.textContent = "SAVING...";

            try {
                const hallOfReRef = collection(db, 'artifacts', appId, 'public', 'data', 'hall-of-re');
                await addDoc(hallOfReRef, { 
                    name: playerName, 
                    time: 300, 
                    timestamp: new Date().toISOString() 
                });
                
                statusTitle.textContent = "SCORE SAVED";
                statusContent.innerHTML = `<p>Your victory has been recorded, ${playerName}.</p>`;

            } catch (error) {
                console.error("Error saving score:", error);
                statusContent.innerHTML = `<p style="color:yellow;">Error: Could not save score. Please try again.</p>`;
            } finally {
                // Show main buttons again
                startButton.style.display = 'inline-block';
                startButton.textContent = "PLAY AGAIN?";
                hallOfReButton.style.display = 'inline-block';
            }
        }

        async function showHallOfRe() {
            if (!isAuthReady) {
                alert("Connecting to leaderboard... Please try again in a moment.");
                return;
            }
            
            overlay.style.display = 'none';
            hallOfReOverlay.style.display = 'flex';
            scoreList.innerHTML = '<li>Loading...</li>';
            
            try {
                const hallOfReRef = collection(db, 'artifacts', appId, 'public', 'data', 'hall-of-re');
                const querySnapshot = await getDocs(hallOfReRef);
                
                const scores = [];
                querySnapshot.forEach((doc) => {
                    scores.push(doc.data());
                });
                
                // Sort scores by date, newest first (no orderBy in query)
                scores.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                
                scoreList.innerHTML = ''; // Clear loading
                if (scores.length === 0) {
                    scoreList.innerHTML = '<li>No one has survived yet...</li>';
                } else {
                    scores.forEach(score => {
                        const li = document.createElement('li');
                        li.textContent = `${score.name} - Survived 5:00 (${new Date(score.timestamp).toLocaleDateString()})`;
                        scoreList.appendChild(li);
                    });
                }
            } catch (error) {
                console.error("Error loading Hall of RE:", error);
                scoreList.innerHTML = '<li>Error loading scores.</li>';
            }
        }

        function hideHallOfRe() {
            hallOfReOverlay.style.display = 'none';
            overlay.style.display = 'flex';
        }

        // --- START THE APP ---
        init();

    </script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            color: #ff0000; /* Blood red font */
            font-family: 'Creepster', cursive;
            cursor: crosshair;
        }

        /* The main UI for timer and messages */
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            font-size: 2.5em;
            text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000;
        }

        #timer {
            font-size: 2em;
            letter-spacing: 3px;
        }

        #message {
            font-size: 0.8em;
            color: #ff4444;
        }

        /* Center crosshair for aiming/looking */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 4px;
            background: rgba(255, 0, 0, 0.7);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            box-shadow: 0 0 5px #ff0000;
        }

        /* Base styles for overlays */
        .overlayBase {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Main menu/game over overlay */
        #overlay {
            display: flex; /* Starts visible */
        }

        #overlay h1, #hallOfReOverlay h1 {
            font-size: 6em;
            margin: 0 0 20px 0;
            color: #ff0000;
            text-shadow: 0 0 20px #ff0000;
        }

        #statusContent p {
            font-size: 2em;
            color: #ff9999;
            max-width: 600px;
        }

        /* Base button style */
        .overlayButton {
            padding: 15px 30px;
            font-size: 2em;
            font-family: 'Creepster', cursive;
            background: #600;
            color: #ff0000;
            border: 2px solid #ff0000;
            border-radius: 10px;
            cursor: pointer;
            text-shadow: 0 0 10px #ff0000;
            margin: 10px;
        }
        .overlayButton:hover:not(:disabled) {
            background: #800;
        }
        .overlayButton:disabled {
            background: #333;
            color: #888;
            border-color: #888;
            cursor: not-allowed;
        }

        /* Specific buttons */
        #startButton { /* Re-using .overlayButton style */ }
        #hallOfReButton { /* Re-using .overlayButton style */ }

        /* Hall of RE Overlay */
        #hallOfReOverlay {
            display: none; /* Starts hidden */
            justify-content: flex-start; /* Align to top */
            padding-top: 5vh;
        }

        #scoreList {
            list-style: none;
            padding: 0;
            margin: 20px 0;
            font-size: 1.5em;
            color: #ff9999;
            max-height: 70vh;
            overflow-y: auto;
            width: 100%;
            max-width: 700px;
        }
        #scoreList li {
            padding: 5px;
            border-bottom: 1px dashed #600;
        }

        /* Player Name Input */
        #playerNameInput {
            font-family: 'Creepster', cursive;
            font-size: 1.5em;
            padding: 10px;
            width: 80%;
            max-width: 400px;
            background: #300;
            border: 2px solid #ff0000;
            color: #ffaaaa;
            border-radius: 5px;
            text-align: center;
        }
        #playerNameInput::placeholder {
            color: #995555;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Game Over/Start Screen -->
    <div id="overlay" class="overlayBase">
        <h1 id="statusTitle">STAY. WATCHING.</h1>
        <div id="statusContent">
            <p>
                You are trapped in an abandoned factory. A creature hunts you.
                <br><br>
                It only moves when you are not looking directly at it.
                <br><br>
                Survive for 5 minutes.
            </p>
        </div>
        <div>
            <button id="startButton" class="overlayButton" onclick="startGame()">BEGIN</button>
            <button id="hallOfReButton" class="overlayButton" onclick="showHallOfRe()">HALL OF RE</button>
        </div>
    </div>

    <!-- Hall of RE Screen -->
    <div id="hallOfReOverlay" class="overlayBase">
        <h1>HALL OF RE</h1>
        <ul id="scoreList">
            <!-- Scores will be loaded here -->
        </ul>
        <button id="hallOfReBackButton" class="overlayButton" onclick="hideHallOfRe()">BACK</button>
    </div>

    <!-- In-Game UI -->
    <div id="ui" style="display: none;">
        <div id="timer">5:00</div>
        <div id="message">Don't look away...</div>
    </div>

    <!-- Center crosshair -->
    <div id="crosshair" style="display: none;"></div>

</body>
</html>
